[project]
name = "EDKG-DL"
dynamic = ["version"]
description = "Deep Learning framework with causality-integrated Endocrine Disruption Knowledge Graph"
readme = "README.md"
authors = [{ name = "haoyuejudy", email = "njutanhaoyue@nju.edu.cn" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
license = "LicenseRef-Custom-Academic-Research"
license-files = ["LICENSE"]
dependencies = [
    "huggingface-hub>=0.32",
    "joblib>=1.5.1",
    "networkx>=3.1",
    "numpy>=1.26,<3",
    "padelpy>=0.1.16",
    "pandas>=2.0",
    "platformdirs>=4.3",
    "requests>=2.31",
    "scikit-learn>=1.6.1",
    "torch>=2.0.0",
    "torch-geometric>=2.4",
    "xgboost>=3.0.2",
    "xlsxwriter>=3.1",
]

[project.optional-dependencies]
api = ["fastapi[standard]>=0.115"]
cpu = ["torch>=2.0.0"]
plots = ["matplotlib>=3.8"]

[project.scripts]
edkg-dl-predict = "edkg_dl.cli:main"
edkg-dl-api = "edkg_dl.http_api:run"

[project.urls]
Homepage = "https://edkgdl.com/"
Repository = "https://github.com/haoyuejudy/EDKG-DL"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "edkg_dl.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["edkg_dl*"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "nju-mirror"
url = "https://mirror.nju.edu.cn/pypi/web/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://mirror.nju.edu.cn/pytorch/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "extra == 'cpu'" }]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["C", "E", "F", "I", "UP", "B", "SIM", "D", "PTH", "W"]
ignore = ["C901", "D415", "E501", "E721", "E741", "F402", "F823"]

[tool.ruff.lint.per-file-ignores]
"test/test_http_api.py" = ["E402"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["test"]
filterwarnings = [
    "ignore:`torch.jit.script` is not supported:FutureWarning",
    "ignore:`torch.jit.script` is deprecated:FutureWarning",
    "ignore:Failing to pass a value to the 'type_params':DeprecationWarning",
    "ignore:Class PassiveAggressiveClassifier is deprecated:FutureWarning",
]
markers = [
    "slow: end-to-end tests that load the real cached model assets",
]
